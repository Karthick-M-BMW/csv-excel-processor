name: Quality Gate

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  quality-gate:
    name: Build and Sonar validation
    runs-on: ubuntu-latest
    services:
      sonarqube:
        image: sonarqube:lts-community
        ports:
          - 9000:9000
        env:
          SONAR_ES_BOOTSTRAP_CHECKS_DISABLE: "true"
          SONAR_WEB_JAVAOPTS: -Xmx512m
          SONAR_CE_JAVAOPTS: -Xmx512m
          SONAR_SEARCH_JAVAOPTS: -Xmx512m
    env:
      SONAR_HOST_URL: http://localhost:9000
      SONAR_LOGIN: admin
      SONAR_PASSWORD: admin
    steps:
      - name: Check out
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Wait for SonarQube
        run: |
          echo "Waiting for SonarQube at ${SONAR_HOST_URL}..."
          for i in $(seq 1 90); do
            status=$(curl -sf "${SONAR_HOST_URL}/api/system/status" | jq -r '.status // empty' || true)
            echo "attempt=${i} status=${status:-DOWN}"
            if [ "${status}" = "UP" ]; then
              exit 0
            fi
            sleep 5
          done
          echo "SonarQube did not become ready in time"
          exit 1

      - name: Run Maven verification and Sonar scan
        run: |
          chmod +x mvnw
          ./mvnw -B verify sonar:sonar \
            -Dsonar.host.url="${SONAR_HOST_URL}" \
            -Dsonar.login="${SONAR_LOGIN}" \
            -Dsonar.password="${SONAR_PASSWORD}" \
            -Dsonar.projectKey=csv-excel-processor \
            -Dsonar.projectName="CSV to Excel Processor (Coding Standards Demo)" \
            -Dsonar.qualitygate.wait=false \
            -Dsonar.qualitygate.timeout=300
